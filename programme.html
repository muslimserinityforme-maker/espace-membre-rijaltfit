<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Démarre ton coaching — Espace Membre Rijal Fit</title>
  <meta name="robots" content="noindex" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;600;700&family=Inter:wght@400;500&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="style.css" />

  <script src="auth.js"></script>
  <script src="jours-data.js"></script>
  <script src="modules-data.js"></script>
  <script>rfRequireAccess();</script>
</head>
<body>

  <div class="topbar">
    <span class="topbar__brand">Rijal Fit · <em>Espace Membre</em></span>
    <a href="espace.html" class="topbar__action">Mes modules</a>
  </div>

  <main class="container container--wide">
    <header class="module-header">
      <a href="espace.html" class="module-header__back">← Retour à mes modules</a>
      <h1 class="module-header__title">Démarre ton coaching</h1>
      <p class="module-header__desc">Ce que contient ton accompagnement, puis ton suivi pas à pas.</p>
    </header>

    <div class="coaching-progress" id="coaching-progress" hidden></div>

    <div class="coaching-restart" id="coaching-restart" hidden></div>

    <div class="programme-layout">
      <aside class="programme-sidebar" id="programme-sidebar"></aside>
      <section class="programme-main" id="programme-main">
        <p class="programme-empty">Chargement…</p>
      </section>
    </div>
  </main>

  <footer class="footer">
    <div class="container">
      <p class="footer__brand">Rijal Fit</p>
      <p class="footer__sub">COACH SANTÉ POUR LES HOMMES MUSULMANS</p>
    </div>
  </footer>

  <script>
    (async function () {
      const access = (await rfRefreshAccess()) || rfGetAccess();
      const formule = (access && access.formule) || 'QIYAM';
      const isRijal = rfHasFormule(formule, 'rijal');

      // Lien Calendly pour prendre un appel.
      const RF_CALENDLY_LIEN = 'https://calendly.com/muslimserinityforme/programme-ton-bilan-intermediaire';

      function noAccessHtml() {
        return '<div class="programme-locked-banner">' +
          '<p class="programme-locked-banner__title">Pas encore accès à cet accompagnement</p>' +
          '<p class="programme-locked-banner__text">Désolé, tu n\'as pas encore accès à cet accompagnement. Si tu souhaites aller plus loin, tu peux prendre un appel.</p>' +
          (RF_CALENDLY_LIEN ? '<p><a class="btn btn--primary" href="' + RF_CALENDLY_LIEN + '" target="_blank" rel="noopener">Prendre un appel</a></p>' : '') +
          '</div>';
      }


      let jourCourant = 0;
      if (access && access.dateDebut) {
        const debut = new Date(access.dateDebut + 'T00:00:00');
        const debutUTC = Date.UTC(debut.getFullYear(), debut.getMonth(), debut.getDate());
        const now = new Date();
        const nowUTC = Date.UTC(now.getFullYear(), now.getMonth(), now.getDate());
        jourCourant = Math.floor((nowUTC - debutUTC) / 86400000) + 1;
      }

      // Pour les 3 formules, un jour se débloque chaque jour à partir de la
      // date de début. QIYAM et THABIT : 90 jours (3 mois), puis il faut
      // l'accès étendu (200 €/mois). RIJAL : les 2 ans sont inclus.
      function isJourUnlocked(jour) {
        if (!access || !access.dateDebut) return false;
        if (jour > jourCourant) return false;
        if (jour > 90 && !isRijal && !access.accesEtendu) return false;
        return true;
      }

      function formatDateJour(jour) {
        if (!access || !access.dateDebut) return 'bientôt';
        const debut = new Date(access.dateDebut + 'T00:00:00');
        const d = new Date(debut);
        d.setDate(d.getDate() + (jour - 1));
        return d.toLocaleDateString('fr-FR');
      }

      const sidebar = document.getElementById('programme-sidebar');
      const main = document.getElementById('programme-main');
      if (!rfHasCoaching(formule)) {
        main.innerHTML = noAccessHtml();
        return;
      }
      const totalSemaines = Math.ceil(RF_JOURS_TOTAL / 7);
      const semaineCourante = jourCourant > 0 ? Math.ceil(Math.min(jourCourant, RF_JOURS_TOTAL) / 7) : 1;

      // Rendu d'un bloc de jour (même logique que les chapitres des modules).
      // { chapter: { mod, niveau, sous } } reprend les blocs d'un chapitre.
      function blockHtml(block, title) {
        if (block.image) return '<div class="niveau__images"><img src="' + block.image + '" alt="" loading="lazy"></div>';
        if (block.video) return '<div class="video-embed"><iframe src="https://www.youtube.com/embed/' + block.video + '" title="' + title + '" allowfullscreen loading="lazy"></iframe></div>';
        if (block.text) return '<div class="niveau__text"><p>' + block.text + '</p></div>';
        if (block.chapter && typeof RF_MODULES !== 'undefined') {
          const mod = RF_MODULES.filter(function (m) { return m.id === block.chapter.mod; })[0];
          const niveau = mod && mod.niveaux[block.chapter.niveau];
          const chap = niveau && (niveau.sousNiveaux ? niveau.sousNiveaux[block.chapter.sous] : niveau);
          if (chap && chap.blocks) return chap.blocks.map(function (b) { return blockHtml(b, title); }).join('');
        }
        return '';
      }

      // ── Jours terminés → pourcentage de l'accompagnement ──
      const JOURS_DONE_KEY = 'rf_jours_done';
      function getJoursDone() {
        try { const raw = localStorage.getItem(JOURS_DONE_KEY); return raw ? JSON.parse(raw) : []; } catch (err) { return []; }
      }
      function setJoursDone(list) {
        try { localStorage.setItem(JOURS_DONE_KEY, JSON.stringify(list)); } catch (err) { /* rien à faire */ }
      }
      // 90 jours pour QIYAM et THABIT, 730 pour RIJAL (ou accès étendu).
      const joursTotalAccompagnement = (isRijal || (access && access.accesEtendu)) ? RF_JOURS_TOTAL : 90;
      const progressBox = document.getElementById('coaching-progress');
      function updateCoachingProgress() {
        if (!rfHasCoaching(formule) || !access || !access.dateDebut) return;
        const done = getJoursDone().filter(function (j) { return j >= 1 && j <= joursTotalAccompagnement; }).length;
        const pct = Math.round((done / joursTotalAccompagnement) * 100);
        progressBox.hidden = false;
        progressBox.innerHTML =
          '<div class="coaching-progress__top"><strong>' + pct + ' % de ton accompagnement terminé</strong><span>' + done + ' / ' + joursTotalAccompagnement + ' jours</span></div>' +
          '<div class="coaching-progress__bar"><span style="width:' + pct + '%"></span></div>';
        const doneList = getJoursDone();
        document.querySelectorAll('.jour-item:not(.is-locked)').forEach(function (btn) {
          const icon = btn.querySelector('.jour-item__icon');
          if (icon) icon.textContent = doneList.indexOf(Number(btn.dataset.jour)) !== -1 ? '✅' : '🔓';
        });
      }

      function renderJour(jour) {
        const content = rfGetJourContent(jour);
        let html = '<p class="eyebrow">Jour ' + jour + '</p><h2 class="niveau__title">' + content.titre + '</h2>';
        if (content.blocks) {
          html += content.blocks.map(function (b) { return blockHtml(b, content.titre); }).join('');
        } else {
          if (content.videoId) {
            html += '<div class="video-embed"><iframe src="https://www.youtube.com/embed/' + content.videoId + '" title="Jour ' + jour + '" allowfullscreen loading="lazy"></iframe></div>';
          }
          html += '<div class="niveau__text"><p>' + content.texte + '</p></div>';
        }
        if (RF_JOURS_OVERRIDES[jour]) {
          const isDone = getJoursDone().indexOf(jour) !== -1;
          html += '<div class="niveau-actions"><button type="button" id="jour-validate-btn" class="btn ' + (isDone ? 'validate-btn is-done' : 'btn--primary validate-btn') + '">' + (isDone ? '✓ Jour terminé' : 'Marquer ce jour comme terminé') + '</button></div>';
        }
        main.innerHTML = html;
        window.scrollTo(0, 0);
        const validateBtn = document.getElementById('jour-validate-btn');
        if (validateBtn) {
          validateBtn.addEventListener('click', function () {
            const list = getJoursDone();
            const pos = list.indexOf(jour);
            if (pos === -1) { list.push(jour); } else { list.splice(pos, 1); }
            setJoursDone(list);
            renderJour(jour);
          });
        }


        sidebar.querySelectorAll('.jour-item').forEach(function (btn) {
          btn.classList.toggle('is-active', Number(btn.dataset.jour) === jour);
        });
        updateCoachingProgress();
      }

      function showLockedMessage(jour) {
        if (!access || !access.dateDebut) {
          main.innerHTML =
            '<div class="programme-locked-banner">' +
            '<p class="programme-locked-banner__title">Ton coaching démarre bientôt</p>' +
            '<p class="programme-locked-banner__text">Ta date de début n\'est pas encore enregistrée. Contacte ton coach pour lancer ton accompagnement.</p>' +
            '</div>';
          return;
        }
        if (jour > 90 && !isRijal && !access.accesEtendu) {
          main.innerHTML = noAccessHtml();
          return;
        }
        main.innerHTML = '<p class="programme-empty">Le Jour ' + jour + ' se débloquera le ' + formatDateJour(jour) + '.</p>';
      }

      let sidebarHtml = '';
      for (let s = 1; s <= totalSemaines; s++) {
        const startJour = (s - 1) * 7 + 1;
        const endJour = Math.min(s * 7, RF_JOURS_TOTAL);
        let daysHtml = '';
        for (let j = startJour; j <= endJour; j++) {
          const unlocked = isJourUnlocked(j);
          const icon = unlocked ? '🔓' : '🔒';
          daysHtml += '<button type="button" class="jour-item' + (unlocked ? '' : ' is-locked') + '" data-jour="' + j + '"><span class="jour-item__icon">' + icon + '</span> Jour ' + j + '</button>';
        }
        const isOpen = s === semaineCourante;
        sidebarHtml +=
          '<div class="semaine' + (isOpen ? ' is-open' : '') + '">' +
          '<button type="button" class="semaine__header' + (s === semaineCourante ? ' is-current' : '') + '">' +
          '<span>Semaine ' + s + '</span><span class="semaine__chevron">›</span>' +
          '</button>' +
          '<div class="semaine__days">' + daysHtml + '</div>' +
          '</div>';
      }
      sidebar.innerHTML = sidebarHtml;

      sidebar.querySelectorAll('.semaine__header').forEach(function (header) {
        header.addEventListener('click', function () {
          header.closest('.semaine').classList.toggle('is-open');
        });
      });

      sidebar.querySelectorAll('.jour-item').forEach(function (btn) {
        btn.addEventListener('click', function () {
          const jour = Number(btn.dataset.jour);
          if (btn.classList.contains('is-locked')) {
            showLockedMessage(jour);
            return;
          }
          renderJour(jour);
        });
      });

      updateCoachingProgress();

      // ── « Je redémarre » : tous les 6 mois, relance l'accompagnement à zéro ──
      // Possible à partir du jour 183, pour RIJAL ou un membre à accès prolongé.
      const RESTART_JOUR = 182; // à garder cohérent avec Code.gs
      const restartBox = document.getElementById('coaching-restart');
      if (rfHasCoaching(formule) && access && access.dateDebut && jourCourant > RESTART_JOUR && (isRijal || access.accesEtendu)) {
        restartBox.hidden = false;
        restartBox.innerHTML =
          '<p class="coaching-restart__title">Tu as terminé 6 mois d\'accompagnement 🎉</p>' +
          '<p class="coaching-restart__text">Tu peux relancer ton coaching à zéro : ta date de début devient aujourd\'hui, tu repars du jour 1 et ton pourcentage repart à 0. Tu peux aussi continuer sans redémarrer : le bouton restera là.</p>' +
          '<p><button type="button" class="btn btn--primary" id="restart-btn">Je redémarre</button></p>' +
          '<p class="coaching-restart__error" id="restart-error" hidden></p>';
        document.getElementById('restart-btn').addEventListener('click', async function () {
          if (!window.confirm('Tu repars du jour 1 et ta progression de l\'accompagnement repart à 0. Confirmer ?')) return;
          const btn = document.getElementById('restart-btn');
          const err = document.getElementById('restart-error');
          btn.disabled = true;
          err.hidden = true;
          try {
            const res = await fetch('/api/restart-coaching', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ code: access.code }),
            });
            const data = await res.json();
            if (res.ok && data.ok) {
              try { localStorage.removeItem('rf_jours_done'); } catch (e) { /* rien à faire */ }
              await rfRefreshAccess();
              window.location.href = 'programme.html';
              return;
            }
          } catch (e) { /* message ci-dessous */ }
          btn.disabled = false;
          err.textContent = 'Impossible de redémarrer pour le moment. Réessaie dans un instant ou contacte ton coach.';
          err.hidden = false;
        });
      }

      // Ouvre directement le jour demandé si le lien vient d'un message
      // Telegram (?jour=N) ou, par défaut, le jour courant.
      const params = new URLSearchParams(window.location.search);
      const jourDemande = Number(params.get('jour')) || jourCourant || 1;
      if (isJourUnlocked(jourDemande)) {
        renderJour(jourDemande);
      } else {
        showLockedMessage(jourDemande);
      }
    })();
  </script>
</body>
</html>
