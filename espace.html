<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Espace Membre — Rijal Fit</title>
  <meta name="robots" content="noindex" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;600;700&family=Inter:wght@400;500&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="style.css" />

  <script src="auth.js"></script>
  <script src="modules-data.js"></script>
  <script src="nutrition-protocol.js"></script>
  <script src="facile-app.js"></script>
  <script src="announcements-data.js"></script>
  <script>rfRequireAccess();</script>
</head>
<body>

  <div class="topbar">
    <span class="topbar__brand">Rijal Fit · <em>Espace Membre</em></span>
    <span id="topbar-module" class="topbar__module"></span><div class="avatar-menu"><button type="button" class="avatar-btn" id="avatar-btn" aria-label="Mon compte">R</button><div class="avatar-drop" id="avatar-drop"><button type="button" id="logout-btn" class="topbar__action">Se déconnecter</button></div></div>
  </div>

  <main class="container container--wide">

    <header class="dash-header">
      <div class="ring">
        <svg width="84" height="84" viewBox="0 0 84 84">
          <circle cx="42" cy="42" r="36" fill="none" stroke="rgba(245,240,232,.25)" stroke-width="7" />
          <circle id="ring-fill" cx="42" cy="42" r="36" fill="none" stroke="#C9A84C" stroke-width="7" stroke-linecap="round" stroke-dasharray="226.2" stroke-dashoffset="226.2" />
        </svg>
        <span class="ring__pct" id="ring-pct">0%</span>
      </div>
      <div class="dash-header__body">
        <p class="dash-header__hello">Bienvenue sur ton espace membre</p>
        <p class="dash-header__sub" id="dash-progress-text">0% de ta formation Starter terminée</p>
      </div>
      <div class="dash-header__actions">
        <button type="button" id="continue-btn" class="btn btn--primary">Reprendre ma formation →</button>
        <div class="dash-search">
          <input type="text" id="dash-search-input" placeholder="🔍 Rechercher dans l'espace membre…" autocomplete="off" />
          <div class="dash-search__results" id="dash-search-results" hidden></div>
        </div>
      </div>
    </header>

    <nav class="dash-tabs" id="dash-tabs">
      <button type="button" class="dash-tab" data-view="dashboard">Tableau de bord</button>
      <button type="button" class="dash-tab" data-view="telegram">Télégramme</button>
      <button type="button" class="dash-tab" data-view="favoris">Favoris</button>
      <button type="button" class="dash-tab" data-view="annonces">Annonces</button>
    </nav>

    <div class="dash-layout">
      <aside class="dash-sidebar" id="dash-sidebar"></aside>
      <section class="dash-main" id="dash-main"></section>
    </div>

  </main>

  <footer class="footer">
    <div class="container">
      <p class="footer__brand">Rijal Fit</p>
      <p class="footer__sub">Coach Réalignement Corps &amp; Foi</p>
    </div>
  </footer>

  <script>
    document.getElementById('avatar-btn').addEventListener('click', function (e) { e.stopPropagation(); document.getElementById('avatar-drop').classList.toggle('is-open'); });
    document.addEventListener('click', function () { document.getElementById('avatar-drop').classList.remove('is-open'); });
    document.getElementById('logout-btn').addEventListener('click', function () {
      rfClearAccess();
      window.location.href = 'index.html';
    });

    (function () {
      var PROGRESS_KEY = 'rf_module_progress';
      var FAVORITES_KEY = 'rf_favorites';
      var TELEGRAM_COMMUNAUTE_LIEN = 'LIEN_TELEGRAM_COMMUNAUTE_ICI';

      function getProgress() {
        try {
          var raw = localStorage.getItem(PROGRESS_KEY);
          return raw ? JSON.parse(raw) : [];
        } catch (err) { return []; }
      }

      function setProgress(list) {
        try { localStorage.setItem(PROGRESS_KEY, JSON.stringify(list)); } catch (err) { /* rien à faire */ }
      }

      function getFavorites() {
        try {
          var raw = localStorage.getItem(FAVORITES_KEY);
          return raw ? JSON.parse(raw) : [];
        } catch (err) { return []; }
      }

      function setFavorites(list) {
        try { localStorage.setItem(FAVORITES_KEY, JSON.stringify(list)); } catch (err) { /* rien à faire */ }
      }

      function niveauKey(modId, i, sousIdx) {
        return modId + '-' + i + (sousIdx === undefined || sousIdx === null ? '' : '-s' + sousIdx);
      }

      // Un niveau avec sousNiveaux compte pour autant d'unités que de
      // sous-onglets (chacun avec sa propre progression) ; sinon 1 unité.
      function niveauUnitKeys(modId, i, niveau) {
        if (niveau.sousNiveaux) {
          return niveau.sousNiveaux.map(function (sn, si) { return niveauKey(modId, i, si); });
        }
        return [niveauKey(modId, i)];
      }

      function niveauDoneCount(progress, modId, i, niveau) {
        return niveauUnitKeys(modId, i, niveau).filter(function (k) { return progress.indexOf(k) !== -1; }).length;
      }

      var access = rfGetAccess();
      var formule = (access && access.formule) || 'QIYAM';

      function isNiveauLocked(niveau) {
        return !!niveau.minFormule && !rfHasFormule(formule, niveau.minFormule);
      }

      var ALL_UNIT_KEYS = [];
      RF_MODULES.forEach(function (mod) {
        mod.niveaux.forEach(function (niveau, i) {
          ALL_UNIT_KEYS = ALL_UNIT_KEYS.concat(niveauUnitKeys(mod.id, i, niveau));
        });
      });
      var totalNiveaux = ALL_UNIT_KEYS.length;
      var currentSousIdx = 0;

      var sidebar = document.getElementById('dash-sidebar');
      var main = document.getElementById('dash-main');
      var ringFill = document.getElementById('ring-fill');
      var ringPct = document.getElementById('ring-pct');
      var progressText = document.getElementById('dash-progress-text');
      var tabsNav = document.getElementById('dash-tabs');
      var searchInput = document.getElementById('dash-search-input');
      var searchResults = document.getElementById('dash-search-results');
      var RING_CIRC = 226.2;

      function updateRing() {
        var progress = getProgress();
        var done = ALL_UNIT_KEYS.filter(function (k) { return progress.indexOf(k) !== -1; }).length;
        var pct = totalNiveaux ? Math.round((done / totalNiveaux) * 100) : 0;
        ringFill.style.strokeDashoffset = String(RING_CIRC * (1 - pct / 100));
        ringPct.textContent = pct + '%';
        progressText.textContent = pct + '% de ta formation terminée';
      }

      function setActiveTab(view) {
        tabsNav.querySelectorAll('.dash-tab').forEach(function (btn) {
          btn.classList.toggle('is-active', btn.dataset.view === view);
        });
      }

      function renderSidebar(activeMod, activeIdx) {
        var progress = getProgress();
        var html = '';
        RF_MODULES.forEach(function (mod, mi) {
          var moduleTotal = 0;
          var doneCount = mod.niveaux.reduce(function (sum, niveau, i) {
            moduleTotal += niveauUnitKeys(mod.id, i, niveau).length;
            return sum + niveauDoneCount(progress, mod.id, i, niveau);
          }, 0);
          var isOpen = mod.id === activeMod;
          html += '<div class="nav-group' + (isOpen ? ' is-open' : '') + '" data-mod="' + mod.id + '">';
          var label = (mod.num ? mod.num + '. ' : '') + mod.nom;
          html += '<button type="button" class="nav-group__header"><span class="nav-group__title">' + label + '</span><span class="nav-group__pct">' + doneCount + '/' + moduleTotal + '</span><span class="nav-group__chevron">›</span></button>';
          html += '<div class="nav-group__items">';
          mod.niveaux.forEach(function (niveau, i) {
            var unitKeys = niveauUnitKeys(mod.id, i, niveau);
            var isDone = unitKeys.every(function (k) { return progress.indexOf(k) !== -1; });
            var isActive = mod.id === activeMod && i === activeIdx;
            var isLocked = isNiveauLocked(niveau);
            html += '<button type="button" class="nav-item' + (isDone ? ' is-done' : '') + (isActive ? ' is-active' : '') + (isLocked ? ' is-locked' : '') + '" data-mod="' + mod.id + '" data-idx="' + i + '"><span class="nav-item__check">' + (isLocked ? '🔒' : (isDone ? '✓' : '')) + '</span>' + niveau.titre + '</button>';
          });
          html += '</div></div>';
        });
        html += '<a href="programme.html" class="nav-item nav-item--programme">🔒 Mon Programme</a>';
        sidebar.innerHTML = html;

        sidebar.querySelectorAll('.nav-group__header').forEach(function (header) {
          header.addEventListener('click', function () {
            header.closest('.nav-group').classList.toggle('is-open');
          });
        });

        sidebar.querySelectorAll('.nav-item[data-mod]').forEach(function (btn) {
          btn.addEventListener('click', function () {
            renderNiveau(btn.dataset.mod, Number(btn.dataset.idx));
          });
        });
      }

      function niveauActionsHtml(modId, idx, sousIdx) {
        var key = niveauKey(modId, idx, sousIdx);
        var isDone = getProgress().indexOf(key) !== -1;
        var isFav = getFavorites().indexOf(key) !== -1;
        return (
          '<div class="niveau-actions">' +
          '<button type="button" id="validate-btn" class="btn ' + (isDone ? 'validate-btn is-done' : 'btn--primary validate-btn') + '">' + (isDone ? '✓ Terminé' : 'Marquer comme terminé') + '</button>' +
          '<button type="button" id="favorite-btn" class="favorite-btn' + (isFav ? ' is-fav' : '') + '">' + (isFav ? '★ Dans mes favoris' : '☆ Ajouter aux favoris') + '</button>' +
          '</div>'
        );
      }

      function bindNiveauActions(modId, idx, sousIdx) {
        var key = niveauKey(modId, idx, sousIdx);

        document.getElementById('validate-btn').addEventListener('click', function () {
          var progress = getProgress();
          var pos = progress.indexOf(key);
          if (pos === -1) { progress.push(key); } else { progress.splice(pos, 1); }
          setProgress(progress);
          updateRing();
          renderNiveau(modId, idx, currentSousIdx);
        });

        document.getElementById('favorite-btn').addEventListener('click', function () {
          var favorites = getFavorites();
          var pos = favorites.indexOf(key);
          if (pos === -1) { favorites.push(key); } else { favorites.splice(pos, 1); }
          setFavorites(favorites);
          renderNiveau(modId, idx, currentSousIdx);
        });
      }

      function renderNiveau(modId, idx, sousIdx) {
        setActiveTab(null);
        var mod = RF_MODULES.find(function (m) { return m.id === modId; });
        var niveau = mod.niveaux[idx];

        var tm = document.getElementById('topbar-module'); if (tm) tm.textContent = mod.nom;
        var html = '<div class="niveau-hero"><p class="eyebrow">' + mod.nom + '</p><h2 class="niveau__title">' + niveau.titre + '</h2></div>';

        if (isNiveauLocked(niveau)) {
          var formuleLabel = niveau.minFormule.toUpperCase();
          html +=
            '<div class="programme-locked-banner">' +
            '<p class="programme-locked-banner__title">Réservé à la formule ' + formuleLabel + '</p>' +
            '<p class="programme-locked-banner__text">Ce niveau se débloque à partir de la formule ' + formuleLabel + '. Contacte Matthieu pour passer au palier supérieur.</p>' +
            '</div>';
          main.innerHTML = html;
          renderSidebar(modId, idx);
          return;
        }

        if (niveau.special === 'nutrition-protocol') {
          html += '<div id="np-root"></div>';
          html += niveauActionsHtml(modId, idx);
          main.innerHTML = html;
          rfRenderNutritionProtocol(document.getElementById('np-root'));
          bindNiveauActions(modId, idx);
          renderSidebar(modId, idx);
          return;
        }

        if (niveau.special === 'facile-app') {
          html += '<div id="facile-app-root"></div>';
          html += niveauActionsHtml(modId, idx);
          main.innerHTML = html;
          rfRenderFacileApp(document.getElementById('facile-app-root'));
          bindNiveauActions(modId, idx);
          renderSidebar(modId, idx);
          return;
        }

        if (niveau.sousNiveaux) {
          currentSousIdx = sousIdx || 0;
          var activeSous = niveau.sousNiveaux[currentSousIdx] || niveau.sousNiveaux[0];
          html += '<div class="sous-tabs">' + niveau.sousNiveaux.map(function (sn, si) {
            return '<button type="button" class="sous-tab' + (si === currentSousIdx ? ' is-active' : '') + '" data-sous="' + si + '">' + sn.titre + '</button>';
          }).join('') + '</div>';
          (activeSous.blocks || []).forEach(function (block) {
            if (block.image) {
              html += '<div class="niveau__images"><img src="' + block.image + '" alt="" loading="lazy"></div>';
            } else if (block.text) {
              html += '<div class="niveau__text"><p>' + block.text + '</p></div>';
            }
          });
          html += niveauActionsHtml(modId, idx, currentSousIdx);
          main.innerHTML = html;
          main.querySelectorAll('.sous-tab').forEach(function (btn) {
            btn.addEventListener('click', function () {
              renderNiveau(modId, idx, Number(btn.dataset.sous));
            });
          });
          bindNiveauActions(modId, idx, currentSousIdx);
          renderSidebar(modId, idx);
          return;
        }

        if (niveau.blocks) {
          // Ordre exact contrôlé bloc par bloc (texte et images intercalés).
          niveau.blocks.forEach(function (block) {
            if (block.image) {
              html += '<div class="niveau__images"><img src="' + block.image + '" alt="" loading="lazy"></div>';
            } else if (block.text) {
              html += '<div class="niveau__text"><p>' + block.text + '</p></div>';
            }
          });
        } else {
          if (niveau.videoId) {
            html += '<div class="video-embed"><iframe src="https://www.youtube.com/embed/' + niveau.videoId + '" title="' + niveau.titre + '" allowfullscreen loading="lazy"></iframe></div>';
          } else if (!niveau.images) {
            html += '<div class="video-embed"><span class="video-embed__placeholder">🎬 Vidéo à venir</span></div>';
          }
          if (niveau.images) {
            if (niveau.images.length) {
              html += '<div class="niveau__images">' + niveau.images.map(function (src) { return '<img src="' + src + '" alt="" loading="lazy">'; }).join('') + '</div>';
            } else {
              html += '<p class="niveau__placeholder">Images d\'illustration à venir.</p>';
            }
          }
          var paragraphes = Array.isArray(niveau.texte) ? niveau.texte : [niveau.texte];
          html += '<div class="niveau__text">' + paragraphes.map(function (p) { return '<p>' + p + '</p>'; }).join('') + '</div>';
        }
        html += niveauActionsHtml(modId, idx);
        main.innerHTML = html;
        bindNiveauActions(modId, idx);
        renderSidebar(modId, idx);
      }

      function firstIncomplete() {
        var progress = getProgress();
        for (var mi = 0; mi < RF_MODULES.length; mi++) {
          var mod = RF_MODULES[mi];
          for (var i = 0; i < mod.niveaux.length; i++) {
            var niveau = mod.niveaux[i];
            var unitKeys = niveauUnitKeys(mod.id, i, niveau);
            var isDone = unitKeys.every(function (k) { return progress.indexOf(k) !== -1; });
            if (!isDone) return { mod: mod.id, idx: i };
          }
        }
        return { mod: RF_MODULES[0].id, idx: 0 };
      }

      // ── Onglets Tableau de bord / Télégramme / Favoris / Annonces ──
      function renderDashboardTab() {
        setActiveTab('dashboard');
        renderSidebar(null, null);
        main.innerHTML =
          '<p class="eyebrow">Tableau de bord</p>' +
          '<h2 class="niveau__title">Bienvenue sur Rijal Fit</h2>' +
          '<div class="video-embed"><span class="video-embed__placeholder">🎬 Vidéo de bienvenue à venir</span></div>';
      }

      function renderTelegramTab() {
        setActiveTab('telegram');
        renderSidebar(null, null);
        main.innerHTML =
          '<p class="eyebrow">Communauté</p>' +
          '<h2 class="niveau__title">Rejoins la communauté Telegram</h2>' +
          '<div class="niveau__text"><p>Échange avec les autres membres, pose tes questions et reste motivé au quotidien.</p></div>' +
          '<a href="' + TELEGRAM_COMMUNAUTE_LIEN + '" target="_blank" rel="noopener" class="btn btn--primary">Rejoindre le groupe Telegram →</a>';
      }

      function renderFavorisTab() {
        setActiveTab('favoris');
        renderSidebar(null, null);
        var favorites = getFavorites();
        var html = '<p class="eyebrow">Mes favoris</p><h2 class="niveau__title">Vidéos et textes enregistrés</h2>';
        if (!favorites.length) {
          html += '<p class="programme-empty">Tu n\'as encore rien mis en favoris. Clique sur ☆ Ajouter aux favoris sous une vidéo ou un texte pour le retrouver ici.</p>';
        } else {
          html += '<div class="modules-grid">';
          favorites.forEach(function (key) {
            var sepIdx = key.lastIndexOf('-');
            var modId = key.slice(0, sepIdx);
            var idx = Number(key.slice(sepIdx + 1));
            var mod = RF_MODULES.find(function (m) { return m.id === modId; });
            if (!mod || !mod.niveaux[idx]) return;
            html += '<button type="button" class="module-card favorite-card" data-mod="' + modId + '" data-idx="' + idx + '">' +
              '<span class="module-card__body">' +
              '<span class="module-card__name">' + mod.niveaux[idx].titre + '</span>' +
              '<span class="module-card__desc">' + mod.nom + '</span>' +
              '</span><span class="module-card__arrow">→</span></button>';
          });
          html += '</div>';
        }
        main.innerHTML = html;
        main.querySelectorAll('.favorite-card').forEach(function (btn) {
          btn.addEventListener('click', function () { renderNiveau(btn.dataset.mod, Number(btn.dataset.idx)); });
        });
      }

      function renderAnnoncesTab() {
        setActiveTab('annonces');
        renderSidebar(null, null);
        var html = '<p class="eyebrow">Annonces</p><h2 class="niveau__title">Les dernières nouvelles Rijal Fit</h2>';
        if (!RF_ANNOUNCEMENTS.length) {
          html += '<p class="programme-empty">Aucune annonce pour le moment.</p>';
        } else {
          html += RF_ANNOUNCEMENTS.map(function (a) {
            return '<div class="niveau" style="padding:22px;margin-bottom:16px;">' +
              '<p class="np-hint">' + a.date + '</p>' +
              '<h3 class="niveau__title" style="font-size:1.1rem;margin-bottom:.6rem;">' + a.titre + '</h3>' +
              '<div class="niveau__text"><p>' + a.texte + '</p></div>' +
              '</div>';
          }).join('');
        }
        main.innerHTML = html;
      }

      tabsNav.querySelectorAll('.dash-tab').forEach(function (btn) {
        btn.addEventListener('click', function () {
          var view = btn.dataset.view;
          if (view === 'dashboard') renderDashboardTab();
          if (view === 'telegram') renderTelegramTab();
          if (view === 'favoris') renderFavorisTab();
          if (view === 'annonces') renderAnnoncesTab();
        });
      });

      // ── Recherche ──
      var searchIndex = [];
      RF_MODULES.forEach(function (mod) {
        mod.niveaux.forEach(function (niveau, i) {
          searchIndex.push({ modId: mod.id, idx: i, modNom: mod.nom, titre: niveau.titre });
        });
      });

      function runSearch(query) {
        var q = query.trim().toLowerCase();
        if (!q) { searchResults.hidden = true; searchResults.innerHTML = ''; return; }
        var matches = searchIndex.filter(function (entry) {
          return entry.titre.toLowerCase().indexOf(q) !== -1 || entry.modNom.toLowerCase().indexOf(q) !== -1;
        }).slice(0, 8);

        if (!matches.length) {
          searchResults.innerHTML = '<p class="dash-search__empty">Aucun résultat pour « ' + query + ' ».</p>';
        } else {
          searchResults.innerHTML = matches.map(function (entry) {
            return '<button type="button" class="dash-search__result" data-mod="' + entry.modId + '" data-idx="' + entry.idx + '"><strong>' + entry.titre + '</strong><span>' + entry.modNom + '</span></button>';
          }).join('');
        }
        searchResults.hidden = false;

        searchResults.querySelectorAll('.dash-search__result').forEach(function (btn) {
          btn.addEventListener('click', function () {
            renderNiveau(btn.dataset.mod, Number(btn.dataset.idx));
            searchInput.value = '';
            searchResults.hidden = true;
          });
        });
      }

      searchInput.addEventListener('input', function () { runSearch(searchInput.value); });
      document.addEventListener('click', function (e) {
        if (!e.target.closest('.dash-search')) searchResults.hidden = true;
      });

      document.getElementById('continue-btn').addEventListener('click', function () {
        var target = firstIncomplete();
        renderNiveau(target.mod, target.idx);
      });

      updateRing();
      renderDashboardTab();
    })();
  </script>
</body>
</html>
